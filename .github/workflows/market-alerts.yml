name: Market alerts

on:
  schedule:
    # Every 5 min, 13:00-21:59 UTC, Mon-Fri. This window covers US market
    # hours (09:30-16:00 ET) in both EST and EDT. The script itself checks
    # the real ET clock and whether today is actually a trading day, so
    # off-hours / holiday runs simply do nothing.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:      # lets you run it manually from the Actions tab
    inputs:
      force_summary:
        description: "Send the AI morning summary now (test), ignoring time-of-day"
        type: boolean
        default: false

permissions:
  contents: write         # needed to commit state.json back to the repo

concurrency:
  group: market-alerts    # never let two runs race on the state file
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # morning AI summary (optional)
          FORCE_SUMMARY: ${{ inputs.force_summary }}       # manual test toggle
          DROP_STEP_PCT: "2"   # alert every 2% of drop (-2%, -4%, -6%, ...)
          # Optional overrides (defaults: SPY,QQQ / 0.5% sideways / gemini-2.0-flash):
          # SYMBOLS: "SPY,QQQ"
          # SIDEWAYS_PCT: "0.5"
          # GEMINI_MODEL: "gemini-2.0-flash"
        run: python main.py
      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update alert state [skip ci]"
            git push
          fi
